name: security

permissions:
  contents: read

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Secret scan
        run: npm run check:secrets

      - name: Client secret scan
        run: npm run check:client-secrets

      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
